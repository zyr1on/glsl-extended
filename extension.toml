id = "glsl-extended"
name = "GLSL Extended"
description = "OpenGL 4.6 GLSL support: syntax highlighting + glsl_analyzer LSP (autocomplete/hover/goto-def) + glsl_validator (glslangValidator diagnostics)."
version = "0.1.0"
schema_version = 1
authors = ["Semih"]
repository = "https://github.com/your-username/zed-glsl-extended"

languages = ["languages/glsl"]

[language_servers.glsl_analyzer]
name = "GLSL Analyzer LSP"
language = "GLSL"

[language_servers.glsl_validator]
name = "GLSL Validator LSP"
language = "GLSL"

[grammars.glsl]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-glsl"
commit = "24a6c8ef698e4480fecf8340d771fbcb5de8fbb4"
