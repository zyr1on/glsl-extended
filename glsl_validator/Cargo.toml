[package]
name = "glsl_validator"
version = "0.1.2"
edition = "2021"
authors = ["Semih Ozdemir <semihozdmirr@gmail.com>"]
description = "Lightweight GLSL Language Server wrapper around glslangValidator for OpenGL 4.6"
license = "MIT"
repository = "https://github.com/zyr1on/zed-glsl-extended"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"