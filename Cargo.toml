[package]
name = "zed-glsl-extended"
version = "0.1.20"
edition = "2024"
authors = ["Semih Ozdemir <semihozdmirr@gmail.com>"]
description = "Zed GLSL Extended: High-performance standalone GLSL Language Server for OpenGL 4.6"
license = "MIT"
repository = "https://github.com/zyr1on/zed-glsl-extended"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"